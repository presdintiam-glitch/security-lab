<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مختبر الأمن السيبراني</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e293b;
      padding: 25px;
      border-radius: 14px;
      width: min(85%, 350px);
    }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 7px;
      border: 1px solid #475569;
    }
    button {
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    .consent {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .consent input {
      width: auto;
    }
  </style>
</head>
<body>
  <main class="container">
    <h2>مختبر الأمن السيبراني</h2>
    <p>نموذج تدريبي لإرسال بيانات غير حساسة بموافقتك.</p>

    <form name="security-test"
          method="POST"
          data-netlify="true"
          netlify-honeypot="bot-field">

      <input type="hidden" name="form-name"
             value="security-test">

      <p hidden>
        <label>لا تملأ هذا الحقل:
          <input name="bot-field">
        </label>
      </p>

      <label for="name">الاسم التجريبي</label>
      <input id="name" name="name"
             autocomplete="name" required>

      <label for="email">البريد الإلكتروني</label>
      <input id="email" name="email"
             type="email" required>

      <label for="message">رسالة الاختبار</label>
      <textarea id="message" name="message"
                required></textarea>

      <label class="consent">
        <input type="checkbox" name="consent"
               value="yes" required>
        أوافق على إرسال بيانات الاختبار هذه.
      </label>

      <button type="submit">إرسال الاختبار</button>
    </form>
  </main>
</body>
</html>
